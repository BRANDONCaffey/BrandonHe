[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-info-collection"
version = "0.1.0"
description = "Three-layer AI intelligence collection scaffold"
requires-python = ">=3.12"
dependencies = [
    "scrapling>=0.3.0",
]

[project.optional-dependencies]
app = [
    "pywebview>=5.1",
    "py2app>=0.28.8",
    "pyinstaller>=6.10",
    "setuptools<81",
]

[project.scripts]
ai-info-app = "ai_info_collection.app_main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
