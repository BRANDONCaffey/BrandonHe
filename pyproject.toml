[project]
name = "himpact"
version = "1.0.0rc1"
description = "Himpact live monitoring app (FastAPI + Streamlit)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "streamlit>=1.40,<2.0",
  "pydantic>=2.8,<3.0",
  "requests>=2.32,<3.0",
]

[project.optional-dependencies]
live = [
  "lseg-data>=2.0.0",
]
dev = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["himpact_core"]

[tool.setuptools.package-dir]
"" = "packages/core"
